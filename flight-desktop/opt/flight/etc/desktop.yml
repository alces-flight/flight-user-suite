# Configuration for generating default session names.
name_generator:
  # Either "absurd" or "meaningless". Default "absurd".
  strategy: "absurd"

# NOTE: Keep these in sync with the dependencies entry below.
vncpasswd: "/usr/bin/vncpasswd"
websockify: "/usr/bin/websockify"
screen_grabber: "/usr/bin/import"

dependencies:
  - type: exe
    description: "X VNC server"
    paths:
      - "/usr/bin/Xvnc"

  - type: exe
    description: "VNC password management"
    paths:
      - "/usr/bin/vncpasswd"

  - type: exe
    description: "VNC configuration utility"
    paths:
      - "vncconfig"

  - type: exe
    description: "X authority file utility"
    paths:
      - "xauth"

  - type: exe
    description: "Perl"
    paths:
      - "perl"

  - type: exe
    description: "Websockify"
    optional: true
    failure_message: "Accessing desktop sessions via Flight Web Suite will not be available"
    paths:
      - "/usr/bin/websockify"

  - type: exe
    description: "ImageMagick - screenshot support"
    optional: true
    failure_message: "Display of screenshots in Flight Web Suite will not be available"
    paths:
      - "/usr/bin/import"

# Everything not included in this list is removed from the environment when
# launching a new session.
environment_whitelist:
  - DISPLAY
  - FLIGHT_ROOT
  - HOME
  - LANG
  - PATH
  - PWD
  - UID
  - USER
  - VNCDESKTOP
